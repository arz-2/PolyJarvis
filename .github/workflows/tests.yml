name: tests

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff (correctness rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run --locked ruff check .

  unit:
    name: pure-logic unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked

      - name: Run tests
        # pytest.ini already skips @requires_binaries tests by default; no LAMMPS, EMC,
        # RadonPy or GPU on this runner. POLYJARVIS_MOL_PYTHON points
        # mol_python.run_in_mol_env() at this venv's interpreter (RDKit is a locked
        # dependency) instead of the conda-activate fallback.
        env:
          POLYJARVIS_MOL_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: uv run --locked pytest -v
