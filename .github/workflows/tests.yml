name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    name: pure-logic unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests
        # pytest.ini already skips @requires_binaries tests by default.
        # POLYJARVIS_MOL_PYTHON points mol_python.run_in_mol_env() at this same venv's
        # interpreter (rdkit is in requirements-test.txt) instead of the conda-activate
        # fallback, which needs a local conda install this runner doesn't have.
        env:
          POLYJARVIS_MOL_PYTHON: python
        run: pytest -v
