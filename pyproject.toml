[project]
name = "polyjarvis"
version = "0.3.0"
description = "Deterministic control plane for end-to-end polymer molecular dynamics"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
# The pure-Python layer: planning, validation, recovery policy, the LangGraph driver, and the
# parsers/analysis the test suite imports. LAMMPS, EMC and RadonPy are NOT here; they live on
# the simulation host (mcp-servers/requirements.txt and env/*.yml). Versions match that host.
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pandas==3.0.3",
    "matplotlib==3.10.9",
    # check_equilibration_comprehensive.py imports MDAnalysis at module load
    "MDAnalysis==2.10.0",
    # same release as env/mol-builder.yml, where the host runs every RDKit computation;
    # POLYJARVIS_MOL_PYTHON points mol_python.run_in_mol_env() at this interpreter instead
    "rdkit==2025.9.5",
    # the MCP server modules import fastmcp at module scope
    "fastmcp==3.3.1",
    "mcp==1.27.1",
    # orchestration/langgraph/: topology only, it decides when the scripts run, never what they do
    "langgraph==1.2.11",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pyflakes==4.0.3",  # tests/test_equil_workflow_required_args.py undefined-name guard
    "ruff==0.16.10",
]

[tool.uv]
# A set of scripts run in place (they extend sys.path themselves), not an installable package.
package = false

[tool.ruff]
target-version = "py311"
extend-exclude = ["data", "manuscript_v2", "literature", "benchmarks/*/data"]

[tool.ruff.lint]
# Correctness only: syntax errors and pyflakes (undefined names, unused imports/variables).
# No style rules; the codebase has no formatter and diffs stay focused.
select = ["E9", "F"]
